<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Won!</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Press Start 2P', cursive;
    background-color: #1a1a1a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}
.bg-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: fill;
    z-index: -1;
}
.modal-content {
    padding: 40px;
    border-radius: 10px;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    display: inline-block;
    text-align: center;
    opacity: 0.95;
    background-size: cover;
    margin-top: 200px;
}
h1 {
    font-size: 36px;
    margin-bottom: 20px;
    color: #ff00cc;
}
.medal {
    font-size: 80px;
    margin-bottom: 20px;
}
button {
    background-color: orange;
    color: black;
    padding: 15px 30px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
    transition: background-color 0.3s;
    margin-top: 20px;
}
button:hover {
    background-color: #ff66b2;
}
.monetag-banner {
    width: 100%;
    text-align: center;
    margin-top: 20px;
}
</style>
</head>
<body>

<img class="bg-image" src="IMG-20250523-WA0021.jpg" alt="Background">

<div class="modal-content">
    <h1>You Won!</h1>
    <div class="medal">🏆</div>

    <!-- Monetag Multitag Banner -->
    <div class="monetag-banner" id="monetagBannerContainer">
        <script src="https://quge5.com/88/tag.min.js"
                data-zone="196548"
                async
                data-cfasync="false"></script>
    </div>

    <!-- Direct Link button for guaranteed popunder -->
    <button id="directAdBtn">Watch Ad for Bonus</button>
    <br />

    <!-- Next button -->
    <button id="playAgainBtn">Next</button>
</div>

<script>
// Direct Link popunder
document.getElementById('directAdBtn').onclick = function() {
    window.open('https://otieu.com/4/10382366', '_blank');
};

// Next button navigates to next stage
document.getElementById('playAgainBtn').onclick = function() {
    window.location.href = 'stages.html';
};
</script>

</body>
</html>
